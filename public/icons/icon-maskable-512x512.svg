<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="safirMaskGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D96B27" />
      <stop offset="100%" stop-color="#C2581A" />
    </linearGradient>
    <linearGradient id="bgMaskGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#231B18" />
      <stop offset="100%" stop-color="#140E0C" />
    </linearGradient>
  </defs>
  <!-- Full Edge-to-Edge Maskable Background -->
  <rect width="512" height="512" fill="url(#bgMaskGradient)" />
  
  <!-- Outer Artisan Ring Accent (in safe area) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#FAF8F5" stroke-opacity="0.12" stroke-width="8" stroke-dasharray="16 16" />
  
  <!-- Stylized "S" / Flame Craft Emblem (scaled for safe zone) -->
  <path d="M256 128 C210 168 178 200 178 240 C178 280 210 300 250 312 C290 324 316 344 316 376 C316 416 276 442 222 428 C216 425 210 418 204 412" 
        fill="none" 
        stroke="url(#safirMaskGradient)" 
        stroke-width="30" 
        stroke-linecap="round" />
  
  <!-- Top Artisan Sparkle Gem -->
  <polygon points="320,154 334,186 366,200 334,214 320,246 306,214 274,200 306,186" fill="#D96B27" />
  
  <!-- Subtle center glow bead -->
  <circle cx="256" cy="256" r="15" fill="#FAF8F5" opacity="0.9" />
</svg>
