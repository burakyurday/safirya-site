<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="safirGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D96B27" />
      <stop offset="100%" stop-color="#C2581A" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2A4A" />
      <stop offset="100%" stop-color="#121D33" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="64" height="64" rx="16" fill="url(#bgGradient)" />
  
  <!-- Outer Artisan Ring Accent -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#FAF8F5" stroke-opacity="0.1" stroke-width="1.5" stroke-dasharray="3 3" />
  
  <!-- Stylized "S" / Flame Craft Emblem -->
  <path d="M32 12 C25 18 20 23 20 29 C20 35 25 38 31 40 C37 42 41 45 41 50 C41 56 35 60 27 58 C26 57.5 25 56.5 24 55.5" 
        fill="none" 
        stroke="url(#safirGradient)" 
        stroke-width="4.5" 
        stroke-linecap="round" />
  
  <!-- Top Artisan Sparkle Gem -->
  <polygon points="42,16 44,21 49,23 44,25 42,30 40,25 35,23 40,21" fill="#D96B27" />
  
  <!-- Subtle center glow bead -->
  <circle cx="32" cy="32" r="2.5" fill="#FAF8F5" opacity="0.9" />
